[package]
name = "kvs"
version = "0.1.0"
edition = "2024"
authors = ["Samuel Vanderwaal <samuel.vanderwaal@email.com>"]
description = "A simple key-value store"

[lib]
test = false
doctest = false

[[bin]]
name = "kvs"
test = false
doctest = false

[dependencies]
bincode = "2.0.1"
clap = { version ="4.5.47", features = ["derive"] }
serde = "1.0.225"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
